name: Update NSX feed

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours — edit to change frequency
  workflow_dispatch: {}       # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run aggregator
        run: python nsx_feed.py

      - name: Commit updated feed if it changed
        run: |
          git config user.name "nsx-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/feed.xml
          git diff --cached --quiet || git commit -m "Update feed [skip ci]"
          git push
